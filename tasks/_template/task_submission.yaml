# task_submission.yaml (PRIVATE, PORTAL-ONLY)
# This file lets `asibench task submit --task-dir ...` prefill the author-only
# Portal evidence. It is reviewed with the Draft and never exported as a Task file.

schema_version: 1

scientific_goal: ""
core_method: ""
why_difficult: ""
difficulty_assessment: ""

# Author expectations; these are not platform verification.
feasibility_checklist:
  version: 2
  items:
    - {id: deterministic_ground_truth, status: unsure}
    - {id: runtime_budget, status: unsure}
    - {id: offline_runtime, status: unsure}
    - {id: self_contained_inputs, status: unsure}
    - {id: machine_checkable_scoring, status: unsure}

# Set true only after at least one approved multi-turn agent has completed the
# same B1-B4 run in the required Docker OS sandbox. difficulty-check requires
# explicit --agent and --agent-config '{"model":"..."}' values.
local_testing_done: false
local_test_results: []

