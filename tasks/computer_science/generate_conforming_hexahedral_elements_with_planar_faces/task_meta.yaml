id: computer_science.generate_conforming_hexahedral_elements_with_planar_faces
name: Conforming all-hex template replacement for octree hanging-node removal
version: '1.0'
status: final
domain: computer_science
subdomain: mesh_generation
source:
  paper: null
  repo: null
difficulty:
  estimated_lines: 700-900
  estimated_time_minutes: 240-600
  requires_gpu: false
  requires_network: false
tags:
- hexahedral_mesh_generation
- octree
- hanging_node_removal
- template_replacement
- computational_geometry
- mesh_quality
- planar_faces
- vtk
runtime:
  python: '>=3.12'
  packages:
  - numpy>=2.4.0
  - vtk>=9.3.1
prompts:
  b1: prompt_b1.md
  b2: prompt_b2.md
  b3: prompt_b3.md
  b4: prompt_b4.md
input:
  files:
  - name: data/hanging_node_removal.py
    type: code
    description: Octree hanging-node-removal scaffold. Builds the 8x8x8 octree over
      [0, 1024*525]^3 (a 4x4x4 grid of 2x2x2 clusters), marks the twelve cluster edges
      of the two central-diagonal clusters with the binary states 2i and 2i+1 (i =
      0..2047) by inserting the two quartile hanging nodes per marked edge, applies
      template replacement, and writes i.vtk. The bodies of the 24 addCellxxxx template
      functions are left as ```placeholder``` and must be completed by the agent;
      everything else (octree construction, symmetry rotation table, VTK writer, driver
      loop) is already implemented.
