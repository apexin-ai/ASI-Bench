task_id: mcp_e2e.gpaw_mos2_bandgap

output:
  files:
    - name: result.json
      type: data
    - name: bands.png
      type: data
    - name: dos.png
      type: data

evaluation:
  gates:
    - scorer: gpaw_e2e_schema
      severity: hard
      config:
        pred_file: result.json
        png_files: [bands.png, dos.png]

  # Tolerances. The reference is the pinned server's own answer on the same
  # conda lock, and GPAW is deterministic at OMP_NUM_THREADS=1: aarch64 and
  # amd64 agree to ~1e-10 eV on the total energy and the gap, ~9e-9 eV on the
  # Fermi level. Full credit therefore ends at 1e-6 relative, five orders above
  # the platform noise and five below the ~1e-3 relative gap between two
  # neighbouring cutoffs — so copying another instance's run, or another run
  # directory's summary.json, scores zero rather than nearly full marks. Credit
  # runs out at 1e-4 relative for the same reason.
  #
  # The band gap carries the least weight on purpose: ~1.67 eV for a PBE MoS2
  # monolayer is a textbook number that a model can produce without ever
  # calling a tool. The cutoff-dependent total energies cannot be, so they
  # carry the most.
  scoring:
    - scorer: gpaw_e2e_energies
      weight: 35
      config:
        pred_file: result.json
        ref_file: reference.json
        full_score_tol: 1.0e-6
        zero_score_tol: 1.0e-4
    - scorer: gpaw_e2e_relaxation
      weight: 15
      config:
        pred_file: result.json
        ref_file: reference.json
        full_score_tol: 1.0e-6
        zero_score_tol: 1.0e-4
    - scorer: gpaw_e2e_bands
      weight: 20
      config:
        pred_file: result.json
        ref_file: reference.json
        full_score_tol: 1.0e-6
        zero_score_tol: 1.0e-4
    - scorer: gpaw_e2e_convergence
      weight: 20
      config:
        pred_file: result.json
        ref_file: reference.json
    - scorer: gpaw_e2e_artifacts
      weight: 10
      config:
        pred_file: result.json
        ref_file: reference.json
        png_files: [bands.png, dos.png]

# Use --params '{"seed": 31415}' so the instance id ends in __seed31415, which
# `asibench score --repo seed31415` requires for local scoring.
generation:
  script: generate_gt.py
  mode: infinite
  parameters: {}
  timeout_seconds: 120
