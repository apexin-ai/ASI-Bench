id: mcp_e2e.pyscf_rhf_energy
name: "MCP E2E: RHF total energy through the pyscf MCP server"
version: "1.0"

# Fake task for MCP end-to-end testing, not a benchmark task. It lives outside
# tasks/ and is only discovered with --tasks-dir examples/mcp-e2e-tasks
# --include-test.
status: test

domain: chemistry
subdomain: "quantum_chemistry_mcp_e2e"

source:
  paper: null
  repo: "https://github.com/lixin19/mcp2pyscf"

difficulty:
  estimated_lines: 0-20
  estimated_time_minutes: 1-5
  requires_gpu: false
  requires_network: false

tags: [mcp_e2e, pyscf, rhf, tool_call]

# Only generate_gt.py needs PySCF (independent reference). Generate instances
# with `asibench generate --sandbox task`; run the agent with --sandbox none so
# that PySCF is reachable only through the MCP server.
runtime:
  python: ">=3.11"
  packages: ["pyscf==2.9.0"]

prompts:
  b1: prompt_b1.md
  b2: prompt_b2.md
  b3: prompt_b3.md
  b4: prompt_b4.md

input:
  files:
    - name: molecule.json
      type: data
      description: "Closed-shell neutral molecule: name, Cartesian geometry in Angstrom as a PySCF atom string, and basis set."

output:
  files:
    - name: result.json
      type: data
      description: "JSON object with energy_hartree (RHF total energy, float), basis and molecule."
