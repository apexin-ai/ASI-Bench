# Merge runtime.services into your task metadata.
runtime:
  services:
  - name: sagemath
    image: asibench-sagemath:test
    port: 8765
    command:
    - /opt/venv/bin/python
    - /opt/math-mcp/server.py
    - --backend
    - sagemath
    - --transport
    - streamable-http
    startup_timeout_seconds: 180
    memory_mb: 4096
    cpus: 2
  - name: sympy
    image: asibench-sympy:test
    port: 8765
    command:
    - /opt/venv/bin/python
    - /opt/math-mcp/server.py
    - --backend
    - sympy
    - --transport
    - streamable-http
    startup_timeout_seconds: 180
    memory_mb: 2048
    cpus: 2
