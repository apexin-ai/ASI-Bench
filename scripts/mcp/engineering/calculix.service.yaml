{
  "runtime": {
    "services": [
      {
        "name": "calculix-native",
        "image": "asibench-engineering-cae:20261114",
        "port": 8765,
        "command": [
          "/opt/venv/bin/python",
          "/opt/engineering-mcp/server.py",
          "--backend",
          "calculix",
          "--transport",
          "streamable-http"
        ],
        "startup_timeout_seconds": 120,
        "memory_mb": 2048,
        "cpus": 2
      }
    ]
  }
}
